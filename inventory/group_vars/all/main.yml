---
# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
elastic_version: "9.5.4"
elastic_registry: docker.elastic.co

# Rootless podman service account that owns every container.
podman_user: elastic
podman_home: "/home/{{ podman_user }}"

# Hosts (first host of each inventory group).
es_host: "{{ groups['es_cluster'][0] }}"
services_host: "{{ groups['services'][0] }}"

# Elasticsearch cluster layout on podman1. All nodes carry all roles.
es_cluster_name: lab-cluster
es_heap: 2g
es_nodes:
  - { name: es01, http_port: 9200 }
  - { name: es02, http_port: 9201 }
  - { name: es03, http_port: 9202 }
es_urls: >-
  {{ es_nodes | map(attribute='http_port') | map('string')
     | map('regex_replace', '^', 'https://' ~ es_host ~ ':') | list }}

# Service ports on podman2.
kibana_port: 5601
fleet_server_port: 8220
nginx_http_port: 80
nginx_artifacts_port: 443
nginx_epr_port: 8443

fleet_server_policy_id: fleet-server-policy

kibana_url: "https://{{ services_host }}:{{ kibana_port }}"
fleet_server_url: "https://{{ services_host }}:{{ fleet_server_port }}"
epr_public_url: "https://{{ services_host }}:{{ nginx_epr_port }}"
artifacts_public_url: "https://{{ services_host }}/downloads/"

# Offline asset cache (images, agent artifacts, wheels, collections) filled by
# build-cache.yml. Deployments install only from here, never the internet.
cache_dir: "{{ playbook_dir }}/cache"

# Controller-side directory where the CA and service certs are generated.
pki_dir: "{{ playbook_dir }}/pki"
# Extra SANs added to the generated nginx cert (e.g. epr./artifacts. CNAMEs).
nginx_extra_sans: []

# ---------------------------------------------------------------------------
# TLS for external interfaces: Elasticsearch HTTP (9200-9202), Kibana, Fleet
# Server and nginx (artifact mirror + EPR proxy).
#   generated - issue certs from the internal CA in pki/ (default)
#   provided  - use customer-supplied certs from tls_provided_dir
# ES node-to-node transport always uses the internal CA.
# ---------------------------------------------------------------------------
tls_mode: generated
tls_provided_dir: "{{ playbook_dir }}/certs"
# CA bundle (PEM; intermediates and/or root) that issued the provided certs.
tls_provided_ca: ca.crt
# Cert (PEM, leaf first then intermediates) and unencrypted key per interface,
# relative to tls_provided_dir. Point interfaces at the same files if the
# customer issued one certificate per host.
tls_provided_files:
  es-http: { cert: es-http.crt, key: es-http.key }
  kibana: { cert: kibana.crt, key: kibana.key }
  fleet-server: { cert: fleet-server.crt, key: fleet-server.key }
  nginx: { cert: nginx.crt, key: nginx.key }

# Where the pki role stages the external certs (both modes); roles read from
# here: <name>.crt, <name>.key, and ca.crt (what clients must trust).
tls_dir: "{{ pki_dir }}/external"
# External interfaces and the hostname each cert must be valid for.
tls_external_certs:
  - { name: es-http, host: "{{ es_host }}" }
  - { name: kibana, host: "{{ services_host }}" }
  - { name: fleet-server, host: "{{ services_host }}" }
  - { name: nginx, host: "{{ services_host }}" }

# ---------------------------------------------------------------------------
# Secrets -- defined in vault.yml (see vault.yml.example)
# ---------------------------------------------------------------------------
elastic_password: "{{ vault_elastic_password }}"
kibana_system_password: "{{ vault_kibana_system_password }}"
kibana_encryption_key: "{{ vault_kibana_encryption_key }}"
kibana_security_key: "{{ vault_kibana_security_key }}"
kibana_reporting_key: "{{ vault_kibana_reporting_key }}"

# Environment for systemctl --user / podman when becoming the service user.
podman_env:
  XDG_RUNTIME_DIR: "/run/user/{{ podman_host_uid }}"

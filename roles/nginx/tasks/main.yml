---
- name: Pull nginx image
  containers.podman.podman_image:
    name: "{{ nginx_image }}"
  notify: Restart nginx

- name: Deploy nginx directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nginx_base_dir }}/certs"
    - "{{ nginx_artifacts_dir }}/downloads"

- name: Deploy nginx certificates
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ nginx_base_dir }}/certs/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: ca.crt, dest: ca.crt, mode: "0644" }
    - { src: nginx.crt, dest: nginx.crt, mode: "0644" }
    - { src: nginx.key, dest: nginx.key, mode: "0600" }
  notify: Restart nginx

- name: Deploy nginx configuration
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ nginx_base_dir }}/default.conf"
    mode: "0644"
  notify: Restart nginx

- name: Deploy nginx quadlet
  ansible.builtin.template:
    src: nginx.container.j2
    dest: "{{ nginx_quadlet_dir }}/nginx.container"
    mode: "0644"
  notify: Restart nginx

- name: Artifact mirror directories
  ansible.builtin.file:
    path: "{{ nginx_artifacts_dir }}/downloads/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ nginx_artifact_mirror_files | map('dirname') | unique | list }}"

- name: Mirror Elastic GPG key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: "{{ nginx_artifacts_dir }}/GPG-KEY-elasticsearch"
    mode: "0644"

- name: Mirror Elastic artifacts
  ansible.builtin.get_url:
    url: "{{ nginx_artifact_mirror_upstream }}/{{ item }}"
    dest: "{{ nginx_artifacts_dir }}/downloads/{{ item }}"
    mode: "0644"
    timeout: 600
  loop: "{{ nginx_artifact_mirror_files }}"

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure nginx is running
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    scope: user
    daemon_reload: true

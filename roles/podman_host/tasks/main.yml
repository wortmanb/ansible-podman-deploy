---
# rpm/dnf are driven through the CLI rather than ansible.builtin.dnf: on RHEL 8
# the python3-dnf bindings exist only for the system Python 3.6, but ansible-core
# 2.20 runs modules under the python3.12 installed by bootstrap-rhel8.yml.
- name: Check which podman packages are installed
  ansible.builtin.command: "rpm -q {{ item }}"
  loop: "{{ podman_host_packages }}"
  register: podman_host_rpm_check
  changed_when: false
  failed_when: podman_host_rpm_check.rc not in [0, 1]

- name: Install missing podman packages
  ansible.builtin.command: >-
    dnf -y install
    {{ podman_host_rpm_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(' ') }}
  when: podman_host_rpm_check.results | selectattr('rc', 'ne', 0) | list | length > 0
  changed_when: true

- name: Check podman version
  ansible.builtin.command: "podman --version"
  register: podman_host_version
  changed_when: false

- name: Require a podman with Quadlet support
  ansible.builtin.assert:
    that: podman_host_version.stdout.split()[-1] is version(podman_host_min_podman, '>=')
    fail_msg: >-
      {{ podman_host_version.stdout }} is too old; Quadlet needs podman >= {{ podman_host_min_podman }}.
      On RHEL 8 run: dnf module install container-tools:rhel8

- name: Check podman network backend
  ansible.builtin.command: "podman info --format {% raw %}'{{.Host.NetworkBackend}}'{% endraw %}"
  register: podman_host_netbackend
  changed_when: false

# The containers resolve each other by name (es01, epr, ...), which needs
# netavark + aardvark-dns. RHEL 8 podman records its backend on first use, so
# a host that ran podman before netavark was installed stays on CNI until
# `podman system reset`. That wipes root-owned containers/images, so it only
# runs when there are none.
- name: Switch podman to the netavark network backend
  when: podman_host_netbackend.stdout | trim != 'netavark'
  block:
    - name: Require permission to reset podman
      ansible.builtin.assert:
        that: podman_host_manage_network_backend | bool
        fail_msg: >-
          podman uses the '{{ podman_host_netbackend.stdout | trim }}' network backend, not netavark.
          Set podman_host_manage_network_backend: true to let this playbook reset it,
          or run 'podman system reset' yourself.

    - name: List root-owned podman containers, images and volumes
      ansible.builtin.shell: "podman ps -aq; podman images -q; podman volume ls -q"
      register: podman_host_root_objects
      changed_when: false

    - name: Refuse to reset a host that has root podman data
      ansible.builtin.assert:
        that: podman_host_root_objects.stdout | trim == ''
        fail_msg: >-
          Root podman on {{ inventory_hostname }} has containers, images or volumes, so it
          won't be reset automatically. Remove them (or run 'podman system reset') and rerun.

    - name: Ensure the containers.conf.d directory exists
      ansible.builtin.file:
        path: /etc/containers/containers.conf.d
        state: directory
        mode: "0755"

    - name: Select netavark in containers.conf
      ansible.builtin.copy:
        dest: /etc/containers/containers.conf.d/50-netavark.conf
        content: |
          # Managed by Ansible (podman_host role)
          [network]
          network_backend = "netavark"
        owner: root
        group: root
        mode: "0644"

    - name: Reset podman so it adopts the new backend
      ansible.builtin.command: podman system reset --force
      changed_when: true

    - name: Re-check podman network backend
      ansible.builtin.command: "podman info --format {% raw %}'{{.Host.NetworkBackend}}'{% endraw %}"
      register: podman_host_netbackend_after
      changed_when: false
      failed_when: podman_host_netbackend_after.stdout | trim != 'netavark'

- name: Read user namespace limit
  ansible.builtin.command: "sysctl -n user.max_user_namespaces"
  register: podman_host_userns
  changed_when: false

- name: Require user namespaces for rootless podman
  ansible.builtin.assert:
    that: podman_host_userns.stdout | int > 0
    fail_msg: user.max_user_namespaces is 0, so rootless podman cannot start containers

# Rootless podman needs cgroup v2. RHEL 8 boots cgroup v1 by default, RHEL 9+
# boots v2, so this only acts on RHEL 8-style hosts.
- name: Check for cgroup v2
  ansible.builtin.stat:
    path: /sys/fs/cgroup/cgroup.controllers
  register: podman_host_cgroup2

- name: Switch the host to cgroup v2
  when: not podman_host_cgroup2.stat.exists
  block:
    - name: Require permission to change the kernel command line
      ansible.builtin.assert:
        that: podman_host_manage_cgroups | bool
        fail_msg: >-
          {{ inventory_hostname }} is on cgroup v1. Boot with systemd.unified_cgroup_hierarchy=1
          (or set podman_host_manage_cgroups: true to let this playbook do it and reboot).

    - name: Add systemd.unified_cgroup_hierarchy=1 to all kernels
      ansible.builtin.command: grubby --update-kernel=ALL --args=systemd.unified_cgroup_hierarchy=1
      changed_when: true

    - name: Reboot into cgroup v2
      ansible.builtin.reboot:
        reboot_timeout: 900

    - name: Re-check for cgroup v2
      ansible.builtin.stat:
        path: /sys/fs/cgroup/cgroup.controllers
      register: podman_host_cgroup2_after
      failed_when: not podman_host_cgroup2_after.stat.exists

- name: Trust the lab CA system-wide
  ansible.builtin.copy:
    src: "{{ tls_dir }}/ca.crt"
    dest: "{{ podman_host_ca_anchor }}"
    owner: root
    group: root
    mode: "0644"
  when: podman_host_trust_ca | bool
  notify: Update CA trust

- name: Apply sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-podman-elastic.conf
    reload: true
  loop: "{{ podman_host_sysctls | dict2items }}"

# Rootless podman on cgroup v2 needs the user's systemd instance to own the
# cpu/io/memory/pids controllers; otherwise runc fails with "pids.max: no such
# file or directory". RHEL 8's systemd (239) doesn't delegate them by default.
- name: Delegate cgroup controllers to user services
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@.service.d/delegate.conf
    content: |
      # Managed by Ansible (podman_host role)
      [Service]
      Delegate={{ podman_host_cgroup_delegate }}
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  register: podman_host_delegate

- name: Reload systemd after changing delegation
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: podman_host_delegate is changed

- name: Create rootless podman service user
  ansible.builtin.user:
    name: "{{ podman_user }}"
    home: "{{ podman_home }}"
    shell: /bin/bash
    create_home: true

- name: Verify subordinate UID/GID ranges exist
  ansible.builtin.command: "grep -q '^{{ podman_user }}:' {{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  changed_when: false

- name: Enable lingering so user services run without a login session
  ansible.builtin.command: "loginctl enable-linger {{ podman_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ podman_user }}"

- name: Look up service user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ podman_user }}"
  tags: [always]

- name: Record service user UID
  ansible.builtin.set_fact:
    podman_host_uid: "{{ ansible_facts.getent_passwd[podman_user][1] }}"
  tags: [always]

# A running user manager only picks up new delegation when it restarts.
- name: Restart the user manager to apply cgroup delegation
  ansible.builtin.systemd_service:
    name: "user@{{ podman_host_uid }}.service"
    state: restarted
  when: podman_host_delegate is changed

- name: Wait for the user runtime directory
  ansible.builtin.wait_for:
    path: "/run/user/{{ podman_host_uid }}/systemd"
    timeout: 60

- name: Create quadlet directory
  ansible.builtin.file:
    path: "{{ podman_home }}/{{ item }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0750"
  loop: [.config, .config/containers, .config/containers/systemd]

- name: Gather service facts
  ansible.builtin.service_facts:

# firewall-cmd instead of ansible.posix.firewalld, which needs python3-firewall
# (system Python only on RHEL 8).
- name: Check which firewall ports are already open
  ansible.builtin.command: "firewall-cmd --permanent --query-port={{ item }}"
  loop: "{{ podman_host_firewall_ports }}"
  register: podman_host_fw_query
  changed_when: false
  failed_when: podman_host_fw_query.rc not in [0, 1]
  when: ansible_facts.services['firewalld.service'].state | default('') == 'running'

- name: Open firewall ports
  ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item.item }}"
  loop: "{{ podman_host_fw_query.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  register: podman_host_fw_add
  changed_when: true

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  when: podman_host_fw_add is changed
  changed_when: true

---
- name: Check TLS mode
  ansible.builtin.assert:
    that: tls_mode in ['generated', 'provided']
    fail_msg: "tls_mode must be 'generated' or 'provided', not '{{ tls_mode }}'"
  tags: [always]

- name: Create PKI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: ["{{ pki_dir }}", "{{ tls_dir }}"]

- name: CA private key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/ca.key"
    size: 4096
    mode: "0600"

- name: CA CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ pki_dir }}/ca.key"
    common_name: "{{ pki_ca_common_name }}"
    use_common_name_for_san: false
    basic_constraints: ["CA:TRUE"]
    basic_constraints_critical: true
    key_usage: [keyCertSign, cRLSign]
    key_usage_critical: true
  register: pki_ca_csr
  changed_when: false

- name: CA certificate
  community.crypto.x509_certificate:
    path: "{{ pki_dir }}/ca.crt"
    csr_content: "{{ pki_ca_csr.csr }}"
    privatekey_path: "{{ pki_dir }}/ca.key"
    provider: selfsigned
    selfsigned_not_after: "+{{ pki_ca_days }}d"
    mode: "0644"

- name: Elasticsearch node certificates
  ansible.builtin.include_tasks: cert.yml
  loop: "{{ es_nodes }}"
  loop_control:
    loop_var: pki_cert
  vars:
    pki_cert_name: "{{ pki_cert.name }}"
    pki_cert_sans: ["DNS:{{ pki_cert.name }}", "DNS:{{ es_host }}"]

- name: Generated external certificates
  ansible.builtin.include_tasks: generated.yml
  when: tls_mode == 'generated'

- name: Provided external certificates
  ansible.builtin.include_tasks: provided.yml
  when: tls_mode == 'provided'

# Elasticsearch serves the full chain in issuer order (Java rejects
# out-of-order or duplicate certs). Fleet's ES output trusts the top of this
# chain by fingerprint, which works because ES presents it.
- name: Build ordered Elasticsearch HTTP chain
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/build_chain.py"
      - "{{ tls_dir }}/es-http.crt"
      - "{{ tls_dir }}/ca.crt"
      - "{{ tls_dir }}/es-http-chain.crt"
  register: pki_es_chain
  changed_when: (pki_es_chain.stdout | from_json).changed
  tags: [always]

- name: Record external CA SHA-256 fingerprint
  ansible.builtin.set_fact:
    pki_ca_fingerprint: "{{ (pki_es_chain.stdout | from_json).top_fingerprint }}"
  tags: [always]

---
- name: Check provided CA bundle exists
  ansible.builtin.stat:
    path: "{{ tls_provided_dir }}/{{ tls_provided_ca }}"
  register: pki_provided_ca

- name: Fail if the CA bundle is missing
  ansible.builtin.assert:
    that: pki_provided_ca.stat.exists
    fail_msg: "tls_mode=provided but {{ tls_provided_dir }}/{{ tls_provided_ca }} doesn't exist"

- name: Validate provided certificates
  ansible.builtin.include_tasks: validate.yml
  loop: "{{ tls_external_certs }}"
  loop_control:
    loop_var: pki_ext
    label: "{{ pki_ext.name }}"
  vars:
    pki_ext_cert: "{{ tls_provided_dir }}/{{ tls_provided_files[pki_ext.name].cert }}"
    pki_ext_key: "{{ tls_provided_dir }}/{{ tls_provided_files[pki_ext.name].key }}"

- name: Stage provided certificates
  ansible.builtin.copy:
    src: "{{ tls_provided_dir }}/{{ tls_provided_files[item.0.name][item.1] }}"
    dest: "{{ tls_dir }}/{{ item.0.name }}.{{ 'crt' if item.1 == 'cert' else 'key' }}"
    mode: "{{ '0600' if item.1 == 'key' else '0644' }}"
  loop: "{{ tls_external_certs | product(['cert', 'key']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

- name: Stage provided CA bundle
  ansible.builtin.copy:
    src: "{{ tls_provided_dir }}/{{ tls_provided_ca }}"
    dest: "{{ tls_dir }}/ca.crt"
    mode: "0644"

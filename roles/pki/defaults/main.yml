---
pki_ca_common_name: Lab Elastic CA
pki_ca_days: 3650
pki_cert_days: 825
# Start validity this far in the past, so hosts with a slightly slow clock
# (e.g. just after a VM snapshot rollback) don't reject brand-new certs.
pki_backdate: "-1h"

# Common SANs added to every generated cert.
pki_local_sans: ["DNS:localhost", "IP:127.0.0.1"]

# External-interface certs issued in tls_mode=generated (names match
# tls_external_certs). ES node transport certs are derived from es_nodes.
pki_service_certs:
  - name: es-http
    sans: ["DNS:{{ es_host }}"]
  - name: kibana
    sans: ["DNS:kibana", "DNS:{{ services_host }}"]
  - name: fleet-server
    sans: ["DNS:fleet-server", "DNS:{{ services_host }}"]
  - name: nginx
    sans: "{{ ['DNS:nginx', 'DNS:' ~ services_host] + (nginx_extra_sans | map('regex_replace', '^', 'DNS:') | list) }}"

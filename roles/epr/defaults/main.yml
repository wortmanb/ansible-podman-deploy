---
# The full "distribution" image bundles every package (large, ~10+ GB).
# Use "lite-{{ elastic_version }}" for a much smaller subset.
epr_image_tag: "{{ elastic_version }}"
epr_image: "{{ elastic_registry }}/package-registry/distribution:{{ epr_image_tag }}"
epr_quadlet_dir: "{{ podman_home }}/.config/containers/systemd"

---
- name: Ensure EPR image is present
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image_ref: "{{ epr_image }}"

- name: Services podman network
  ansible.builtin.template:
    src: elastic.network.j2
    dest: "{{ epr_quadlet_dir }}/elastic.network"
    mode: "0644"
  notify: Restart epr

- name: EPR quadlet
  ansible.builtin.template:
    src: epr.container.j2
    dest: "{{ epr_quadlet_dir }}/epr.container"
    mode: "0644"
  notify: Restart epr

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure EPR is running
  ansible.builtin.systemd_service:
    name: epr
    state: started
    scope: user
    daemon_reload: true

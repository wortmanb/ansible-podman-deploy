---
- name: "Restart {{ es_node.name }}"
  ansible.builtin.systemd_service:
    name: "{{ es_node.name }}"
    state: restarted
    scope: user
    daemon_reload: true

# During bootstrap no quorum exists until all nodes are up, so only wait
# between nodes on an already-formed cluster (rolling restart).
- name: Wait for cluster before restarting the next node
  ansible.builtin.include_tasks: wait_for_cluster.yml
  when: not elasticsearch_bootstrap | bool

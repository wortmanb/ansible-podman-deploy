---
# cluster.initial_master_nodes must only be set while forming a brand-new
# cluster. If none of the data volumes exist yet, we are bootstrapping.
- name: Check for existing data volumes
  ansible.builtin.command: "podman volume exists {{ item.name }}-data"
  loop: "{{ es_nodes }}"
  register: elasticsearch_volume_check
  changed_when: false
  failed_when: elasticsearch_volume_check.rc not in [0, 1]

- name: Determine whether this is a cluster bootstrap
  ansible.builtin.set_fact:
    elasticsearch_bootstrap: "{{ elasticsearch_volume_check.results | selectattr('rc', 'eq', 0) | list | length == 0 }}"

# Drives the config template and restart behaviour. Kept separate from
# elasticsearch_bootstrap so that even a forced -e elasticsearch_bootstrap=true
# finishes bootstrapping (and drops initial_master_nodes) within this run.
- name: Track whether the cluster is still forming
  ansible.builtin.set_fact:
    elasticsearch_forming: "{{ elasticsearch_bootstrap | bool }}"

- name: Ensure Elasticsearch image is present
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image_ref: "{{ elasticsearch_image }}"

- name: Elasticsearch podman network
  ansible.builtin.template:
    src: elastic.network.j2
    dest: "{{ elasticsearch_quadlet_dir }}/elastic.network"
    mode: "0644"
  notify: Restart elasticsearch

- name: Node directories
  ansible.builtin.file:
    path: "{{ elasticsearch_base_dir }}/{{ item.name }}/certs"
    state: directory
    mode: "0750"
  loop: "{{ es_nodes }}"

# Transport (node-to-node): per-node certs from the internal CA.
- name: Transport certificates
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.1 | replace('node', item.0.name) }}"
    dest: "{{ elasticsearch_base_dir }}/{{ item.0.name }}/certs/{{ item.1 }}"
    mode: "{{ '0600' if item.1.endswith('.key') else '0644' }}"
  loop: "{{ es_nodes | product(['ca.crt', 'node.crt', 'node.key']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  notify: Restart elasticsearch

# HTTP (external): the staged es-http cert, generated or customer-provided.
- name: HTTP key and trusted CA
  ansible.builtin.copy:
    src: "{{ tls_dir }}/{{ item.1.src }}"
    dest: "{{ elasticsearch_base_dir }}/{{ item.0.name }}/certs/{{ item.1.dest }}"
    mode: "{{ item.1.mode }}"
  loop: >-
    {{ es_nodes | product([
         {'src': 'es-http.key', 'dest': 'http.key', 'mode': '0600'},
         {'src': 'ca.crt', 'dest': 'http-ca.crt', 'mode': '0644'}]) | list }}
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.dest }}"
  notify: Restart elasticsearch

# Full chain in issuer order, built by the pki role. Fleet outputs trust ES
# via ca_trusted_fingerprint, which only matches a CA the server presents.
- name: HTTP certificate chain
  ansible.builtin.copy:
    src: "{{ tls_dir }}/es-http-chain.crt"
    dest: "{{ elasticsearch_base_dir }}/{{ item.name }}/certs/http.crt"
    mode: "0644"
  loop: "{{ es_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart elasticsearch

- name: Node configuration
  ansible.builtin.include_tasks: config.yml

- name: Node environment (secrets)
  ansible.builtin.template:
    src: elasticsearch.env.j2
    dest: "{{ elasticsearch_base_dir }}/{{ es_node.name }}/elasticsearch.env"
    mode: "0600"
  loop: "{{ es_nodes }}"
  loop_control:
    loop_var: es_node
    label: "{{ es_node.name }}"
  notify: Restart elasticsearch

- name: Node quadlets
  ansible.builtin.template:
    src: es-node.container.j2
    dest: "{{ elasticsearch_quadlet_dir }}/{{ es_node.name }}.container"
    mode: "0644"
  loop: "{{ es_nodes }}"
  loop_control:
    loop_var: es_node
    label: "{{ es_node.name }}"
  notify: Restart elasticsearch

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure nodes are running
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    state: started
    scope: user
    daemon_reload: true
  loop: "{{ es_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for cluster to form
  ansible.builtin.include_tasks: wait_for_cluster.yml

# Elastic recommends removing cluster.initial_master_nodes once the cluster
# has formed. Do it now, with a rolling restart, instead of on a second run.
# Unconditional on purpose: after a bootstrap the re-render drops the setting
# (and notifies the restart); otherwise it's unchanged and nothing restarts.
# (Not a `when:` block: block conditions are re-checked for every task, so
# the set_fact would make the block skip its own re-render.)
- name: Mark the cluster as formed
  ansible.builtin.set_fact:
    elasticsearch_forming: false

- name: Render final node configuration
  ansible.builtin.include_tasks: config.yml

- name: Rolling restart with the final configuration
  ansible.builtin.meta: flush_handlers

- name: Set kibana_system password
  ansible.builtin.uri:
    url: "{{ es_urls[0] }}/_security/user/kibana_system/_password"
    method: POST
    url_username: elastic
    url_password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ elasticsearch_base_dir }}/{{ es_nodes[0].name }}/certs/http-ca.crt"
    body_format: json
    body:
      password: "{{ kibana_system_password }}"
  no_log: true
  changed_when: false

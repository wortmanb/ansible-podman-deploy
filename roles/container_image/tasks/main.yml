---
- name: Check for image {{ container_image_ref }}
  ansible.builtin.command: "podman image exists {{ container_image_ref }}"
  register: container_image_exists
  changed_when: false
  failed_when: container_image_exists.rc not in [0, 1]

- name: Load image from offline cache
  when: container_image_exists.rc == 1
  block:
    - name: Check the cache has {{ container_image_archive }}
      ansible.builtin.stat:
        path: "{{ cache_dir }}/images/{{ container_image_archive }}"
      delegate_to: localhost
      become: false
      register: container_image_cached

    - name: Fail if the image isn't cached
      ansible.builtin.assert:
        that: container_image_cached.stat.exists
        fail_msg: >-
          {{ container_image_ref }} is not in {{ cache_dir }}/images/. Build the
          cache with the same settings site.yml uses, e.g.
          ansible-playbook -i localhost, build-cache.yml -e elastic_version={{ elastic_version }}
          (add -e epr_image_tag=... if you've overridden it).

    - name: Copy image archive {{ container_image_archive }}
      ansible.builtin.copy:
        src: "{{ cache_dir }}/images/{{ container_image_archive }}"
        dest: "{{ podman_home }}/{{ container_image_archive }}"
        mode: "0600"

    - name: Load image archive {{ container_image_archive }}
      ansible.builtin.command: "podman load -i {{ podman_home }}/{{ container_image_archive }}"
      changed_when: true

    - name: Verify image is now present {{ container_image_ref }}
      ansible.builtin.command: "podman image exists {{ container_image_ref }}"
      changed_when: false

  always:
    - name: Remove image archive {{ container_image_archive }}
      ansible.builtin.file:
        path: "{{ podman_home }}/{{ container_image_archive }}"
        state: absent

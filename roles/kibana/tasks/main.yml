---
- name: Ensure Kibana image is present
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image_ref: "{{ kibana_image }}"

- name: Kibana directories
  ansible.builtin.file:
    path: "{{ kibana_base_dir }}/certs"
    state: directory
    mode: "0750"

- name: Kibana certificates
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ kibana_base_dir }}/certs/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: ca.crt, dest: ca.crt, mode: "0644" }
    - { src: kibana.crt, dest: kibana.crt, mode: "0644" }
    - { src: kibana.key, dest: kibana.key, mode: "0600" }
  notify: Restart kibana

- name: Kibana configuration
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: "{{ kibana_base_dir }}/kibana.yml"
    mode: "0600"
  notify: Restart kibana

- name: Kibana quadlet
  ansible.builtin.template:
    src: kibana.container.j2
    dest: "{{ kibana_quadlet_dir }}/kibana.container"
    mode: "0644"
  notify: Restart kibana

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure Kibana is running
  ansible.builtin.systemd_service:
    name: kibana
    state: started
    scope: user
    daemon_reload: true

- name: Wait for Kibana to become available
  ansible.builtin.uri:
    url: "https://localhost:{{ kibana_port }}/api/status"
    url_username: elastic
    url_password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ kibana_base_dir }}/certs/ca.crt"
  register: kibana_status
  until: kibana_status.json.status.overall.level | default('') == 'available'
  retries: 60
  delay: 10

- name: Wait for Fleet to preconfigure the Fleet Server policy
  ansible.builtin.uri:
    url: "https://localhost:{{ kibana_port }}/api/fleet/agent_policies/{{ fleet_server_policy_id }}"
    url_username: elastic
    url_password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ kibana_base_dir }}/certs/ca.crt"
  register: kibana_fleet_policy
  until: kibana_fleet_policy.status | default(0) == 200
  retries: 30
  delay: 10

- name: Look up the agent download source
  ansible.builtin.uri:
    url: "https://localhost:{{ kibana_port }}/api/fleet/agent_download_sources/{{ kibana_download_source_id }}"
    url_username: elastic
    url_password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ kibana_base_dir }}/certs/ca.crt"
    status_code: [200, 404]
  register: kibana_download_source

- name: Point Fleet at the local artifact mirror
  ansible.builtin.uri:
    url: >-
      https://localhost:{{ kibana_port }}/api/fleet/agent_download_sources{{
      '/' ~ kibana_download_source_id if kibana_download_source.status == 200 else '' }}
    method: "{{ 'PUT' if kibana_download_source.status == 200 else 'POST' }}"
    url_username: elastic
    url_password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ kibana_base_dir }}/certs/ca.crt"
    headers:
      kbn-xsrf: "true"
    body_format: json
    body: >-
      {{ {'name': kibana_download_source_name, 'host': artifacts_public_url, 'is_default': true}
         | combine({} if kibana_download_source.status == 200 else {'id': kibana_download_source_id}) }}
  when: >-
    kibana_download_source.status == 404 or
    kibana_download_source.json.item.host != artifacts_public_url or
    not kibana_download_source.json.item.is_default
  changed_when: true
